[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ar"
dynamic = ["version"]
description = "Arabic and English text extraction from PDFs: the PDF's own text, a rebuild from glyph IDs and font shaping tables, or Tesseract OCR. No language model."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["pdf", "arabic", "text-extraction", "ocr", "fonts", "rtl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Topic :: Text Processing",
]
# PyMuPDF is AGPL-3.0 or commercial.
dependencies = [
    "pymupdf>=1.26",
    "fonttools>=4.50",
]

[project.optional-dependencies]
# The ocr and auto engines and --ocr-check. Tesseract 5 itself is installed outside pip.
ocr = [
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/oreaba/pdf-ar"
Repository = "https://github.com/oreaba/pdf-ar"
Issues = "https://github.com/oreaba/pdf-ar/issues"

[project.scripts]
pdf-ar = "pdf_ar.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pdf_ar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_ar = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
