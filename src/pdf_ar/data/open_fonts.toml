# Where open-licensed fonts that PDFs often embed can be found. pdf-ar never
# downloads them: `pdf-ar fonts` names these sources in its hints, and the user
# adds the files to the fonts folder. Keys are PostScript names with spaces removed.
# Each file is pinned by SHA-256, so a downloaded copy can be checked.

[fonts.Almarai-Regular]
url = "https://github.com/google/fonts/raw/main/ofl/almarai/Almarai-Regular.ttf"
sha256 = "5b5cad33c8e5922083728d271cdcda91f96ba291f1307eccc4f4ef732dc19622"
license = "OFL-1.1"

